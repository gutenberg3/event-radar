<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADAR // CHRONOLOGICAL ROLLCALL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            pixel: ['"Press Start 2P"', 'monospace'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #050b14;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }
    input, button, textarea {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-12">

  <!-- TOP COMMAND HEADER -->
  <header class="w-full max-w-5xl px-3 py-2.5 flex items-center justify-between border-b border-[#0f2338] sticky top-0 bg-[#050b14]/95 backdrop-blur z-20">
    <div class="flex items-center gap-2">
      <span class="inline-block w-2.5 h-2.5 bg-[#00ffcc] shadow-[0_0_8px_#00ffcc]"></span>
      <span class="font-pixel text-xs tracking-wider text-[#00ffcc]">RADAR://NET</span>
      <span id="sync-banner" class="text-[10px] text-[#38bdf8]/60 font-mono tracking-wide ml-1">[READY]</span>
    </div>

    <div class="flex items-center gap-2">
      <div class="flex items-center bg-[#071322] border border-[#163252] px-2 py-1 rounded text-xs">
        <span class="text-[#38bdf8] mr-1.5 text-[11px] font-bold">ID:</span>
        <input 
          id="user-initials" 
          type="text" 
          maxlength="10" 
          placeholder="INITIALS" 
          class="w-20 bg-transparent text-[#00ffcc] font-bold uppercase outline-none focus:text-white"
        />
      </div>

      <button 
        id="btn-add-event"
        type="button"
        class="bg-[#00e699] hover:bg-[#00ffab] text-[#050b14] font-bold text-xs px-2.5 py-1 rounded flex items-center gap-1 transition-all active:scale-95 cursor-pointer"
      >
        <span>+</span> EVENT
      </button>

      <button 
        id="btn-who-dis"
        type="button"
        class="bg-[#081e36] border border-[#19406b] hover:border-[#38bdf8] text-[#38bdf8] text-xs px-2.5 py-1 rounded flex items-center gap-1 cursor-pointer"
      >
        <span>📇</span> WHO DIS?
      </button>
    </div>
  </header>

  <!-- EVENT STREAM -->
  <main class="w-full max-w-5xl px-3 py-3">
    <div id="event-list" class="space-y-2">
      <div class="text-xs text-[#38bdf8]/60 py-12 text-center animate-pulse">Initializing rollcall radar...</div>
    </div>
  </main>

  <!-- EDIT / ADD MODAL -->
  <div id="event-modal" style="display: none;" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 items-center justify-center p-3">
    <div class="bg-[#081526] border border-[#163860] w-full max-w-md p-4 rounded-lg shadow-2xl space-y-3">
      <div class="flex justify-between items-center border-b border-[#163860] pb-2">
        <span id="modal-heading" class="font-pixel text-[10px] text-[#00ffcc]">EDIT EVENT</span>
        <button id="modal-close-x" type="button" class="text-slate-400 hover:text-white text-sm cursor-pointer">✕</button>
      </div>

      <input type="hidden" id="modal-event-index" value="">

      <div>
        <label class="block text-[10px] text-[#38bdf8] uppercase font-bold mb-1">Web Address</label>
        <input 
          id="modal-url" 
          type="url" 
          placeholder="https://conference.org" 
          class="w-full bg-[#050b14] border border-[#163860] px-2.5 py-1.5 rounded text-xs text-white outline-none focus:border-[#00ffcc]"
        />
      </div>

      <div class="space-y-2 pt-1 border-t border-[#163860]/50 text-xs">
        <div>
          <label class="block text-[10px] text-slate-400 uppercase mb-0.5">Title</label>
          <input id="modal-title" type="text" class="w-full bg-[#050b14] border border-[#163860] px-2 py-1 rounded text-white outline-none focus:border-[#00ffcc]">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-slate-400 uppercase mb-0.5">Date Display</label>
            <input id="modal-date-str" type="text" placeholder="e.g. Sep 30 – Oct 2, 2026" class="w-full bg-[#050b14] border border-[#163860] px-2 py-1 rounded text-white outline-none focus:border-[#00ffcc]">
          </div>
          <div>
            <label class="block text-[10px] text-slate-400 uppercase mb-0.5">Start Date (Sort)</label>
            <input id="modal-start-date" type="text" placeholder="YYYY-MM-DD" class="w-full bg-[#050b14] border border-[#163860] px-2 py-1 rounded text-white outline-none focus:border-[#00ffcc] text-[11px]">
          </div>
        </div>

        <div>
          <label class="block text-[10px] text-slate-400 uppercase mb-0.5">Location</label>
          <input id="modal-location" type="text" class="w-full bg-[#050b14] border border-[#163860] px-2 py-1 rounded text-white outline-none focus:border-[#00ffcc]">
        </div>

        <div>
          <label class="block text-[10px] text-slate-400 uppercase mb-0.5">Key Sponsors / Hosts</label>
          <input id="modal-sponsors" type="text" class="w-full bg-[#050b14] border border-[#163860] px-2 py-1 rounded text-white outline-none focus:border-[#00ffcc]">
        </div>
      </div>

      <div class="pt-2 flex justify-end gap-2 border-t border-[#163860]">
        <button id="modal-cancel-btn" type="button" class="px-3 py-1 text-xs text-slate-400 hover:text-white cursor-pointer">CANCEL</button>
        <button id="modal-save-btn" type="button" class="bg-[#00e699] text-[#050b14] font-bold px-4 py-1 text-xs rounded hover:bg-[#00ffab] cursor-pointer">
          SAVE TO SHEET
        </button>
      </div>
    </div>
  </div>

  <!-- WHO DIS MODAL -->
  <div id="who-dis-modal" style="display: none;" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 items-center justify-center p-3">
    <div class="bg-[#081526] border border-[#163860] w-full max-w-sm p-4 rounded-lg space-y-3 shadow-2xl">
      <div class="flex justify-between items-center border-b border-[#163860] pb-2">
        <span class="font-pixel text-[10px] text-[#38bdf8]">WHO DIS? // RADAR OPERATOR</span>
        <button id="who-dis-close" type="button" class="text-slate-400 hover:text-white text-base cursor-pointer">✕</button>
      </div>
      <div class="space-y-2 text-xs text-slate-300">
        <p>Attendees use 2-letter initials or nicknames for lightweight network rollcall.</p>
        <div class="bg-[#050b14] border border-[#163860] rounded p-2 text-[#00ffcc] font-mono text-[11px]">
          &gt; Message Cobb via Text, Signal, WhatsApp, or Telegram.
        </div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyLOxhsA3a86NO0A3MLrqg5fNVb0Tb_MGwUMb3wamgdSJyiyh9om0ritl8j5VODZz_z/exec";

    const FALLBACK_EVENTS = [
      { id: "ignite-pdx", title: "Ignite PDX Hackathon (Brilliance Labs)", startDate: "2026-09-30", dateStr: "Sep 30 – Oct 2, 2026", location: "Portland, OR", url: "https://brilliancelabs.org/ignite-pdx.html", sponsors: "Brilliance Labs, Ignite AI, Frontier Labs", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "missio-nexus-2026", title: "Missio Nexus Annual Leaders Conference", startDate: "2026-09-30", dateStr: "Sep 30 – Oct 2, 2026", location: "Orlando, FL (Caribe Royale) & Virtual", url: "https://web.cvent.com/event/654a1d2b-f757-4491-a480-fc3f68a2ccc5/websitePage:3bf16a10-e965-4de4-88df-84d98c5be47d?environment=P2&RefId=homepage", sponsors: "World Vision, Crossworld, Pioneer Bible", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "gloo-hackathon-2026", title: "Gloo AI Hackathon 2026", startDate: "2026-10-14", dateStr: "Oct 14–16, 2026", location: "Boulder, CO", url: "https://www.gloo.com/hackathon", sponsors: "Gloo, AI Innovation Guild, Kingdom Ops", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "missionary-2026", title: "Missionary 2026 National Conference", startDate: "2026-10-14", dateStr: "Oct 14–16, 2026", location: "Dallas-Fort Worth, TX (SWBTS)", url: "https://www.missionary.com/2026", sponsors: "Missionary.com, Radius International, John Piper, Mark Dever, Kevin DeYoung", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "indigitous-hack-2026", title: "Indigitous #HACK 2026", startDate: "2026-10-16", dateStr: "Oct 16–18, 2026", location: "Global (50+ Cities & Online)", url: "https://indigitous.org/hack", sponsors: "Indigitous, Cru, Global Tech Networks", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "emnlp-2026", title: "EMNLP 2026 (Empirical Methods in NLP)", startDate: "2026-10-24", dateStr: "Oct 24–29, 2026", location: "Budapest, Hungary", url: "https://2026.emnlp.org/", sponsors: "ACL, SIGDAT, Google, Meta", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "the-builder-2026", title: "The Builder Conference (Stackhouse Ventures)", startDate: "2026-11-02", dateStr: "Nov 2–5, 2026", location: "Jackson Hole, WY (SpringHill Suites)", url: "https://stackhouseventures.com/builder-conference", sponsors: "Stackhouse Ventures, Igniter Media, Church Media Squad", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "reach-2026", title: "Reach Conference 2026", startDate: "2026-11-05", dateStr: "Nov 5–7, 2026", location: "Orlando, FL", url: "https://www.reachconf.org/", sponsors: "Reach Network", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "web-summit-2026", title: "Web Summit 2026", startDate: "2026-11-09", dateStr: "Nov 9–12, 2026", location: "Lisbon, Portugal", url: "https://websummit.com/", sponsors: "Web Summit, Global Tech & Ventures", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "neurips-2026", title: "NeurIPS 2026 (Neural Information Processing)", startDate: "2026-12-06", dateStr: "Dec 6–12, 2026", location: "Vancouver, BC, Canada", url: "https://neurips.cc/", sponsors: "NeurIPS Foundation, DeepMind, OpenAI", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "crosscon", title: "Cross Con 2027", startDate: "2027-01-01", dateStr: "Jan 1–3, 2027", location: "Louisville, KY (KICC)", url: "https://crosscon.com/", sponsors: "Cross Network", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "ces-2027", title: "CES 2027", startDate: "2027-01-05", dateStr: "Jan 5–8, 2027", location: "Las Vegas, NV", url: "https://www.ces.tech/", sponsors: "CTA", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "eth-denver-2027", title: "ETHDenver 2027", startDate: "2027-02-23", dateStr: "Feb 2027", location: "Denver, CO", url: "https://www.ethdenver.com/", sponsors: "SporkDAO", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "exponential-2027", title: "Exponential Global 2027", startDate: "2027-03-01", dateStr: "Mar 1–4, 2027", location: "Orlando, FL (First Baptist)", url: "https://exponential.org/events", sponsors: "Exponential, Church Multiplication Networks", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "sxsw-2027", title: "SXSW Interactive 2027", startDate: "2027-03-12", dateStr: "Mar 12–20, 2027", location: "Austin, TX", url: "https://www.sxsw.com/", sponsors: "SXSW, Tech & Media Sponsors", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "missional-ai-2027", title: "Missional AI Summit 2027", startDate: "2027-03-30", dateStr: "Mar 30 – Apr 1, 2027", location: "Hyatt Regency SFO, SF Bay Area, CA", url: "https://missional.ai/", sponsors: "Missional.ai", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "cla-outcomes-2027", title: "Outcomes Conference 2027 (CLA)", startDate: "2027-04-13", dateStr: "Apr 13–15, 2027", location: "Dallas / Fort Worth, TX", url: "https://outcomesconference.org/", sponsors: "Christian Leadership Alliance", yAttendees: "", mAttendees: "", nAttendees: "" },
      { id: "consensus-2027", title: "Consensus 2027", startDate: "2027-05-18", dateStr: "May 18–20, 2027", location: "Toronto, Canada", url: "https://consensus.coindesk.com/", sponsors: "CoinDesk, Institutional Web3", yAttendees: "", mAttendees: "", nAttendees: "" }
    ];

    let eventsData = [...FALLBACK_EVENTS];
    let userInitials = (localStorage.getItem('radar_initials') || '').trim().toUpperCase();

    function cleanArray(str) {
      return String(str || '')
        .replace(/['"]/g, '')
        .split(';')
        .map(s => s.trim().toUpperCase())
        .filter(Boolean);
    }

    function renderEvents() {
      const list = document.getElementById('event-list');
      if (!list) return;

      list.innerHTML = eventsData.map((ev, index) => {
        const yArr = cleanArray(ev.yAttendees);
        const mArr = cleanArray(ev.mAttendees);
        const nArr = cleanArray(ev.nAttendees);

        const isY = userInitials !== '' && yArr.includes(userInitials);
        const isM = userInitials !== '' && mArr.includes(userInitials);
        const isN = userInitials !== '' && nArr.includes(userInitials);

        return `
          <div class="bg-[#081321] border border-[#122842] hover:border-[#1d426d] px-3.5 py-2.5 rounded-md flex flex-col md:flex-row items-start md:items-center justify-between gap-2.5 transition-colors">
            
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-2">
                <a href="${ev.url || '#'}" target="_blank" rel="noopener noreferrer" class="text-xs font-bold text-white hover:text-[#38bdf8] flex items-center gap-1">
                  ${ev.title || 'Untitled'}
                  <span class="text-[10px] text-slate-400">↗</span>
                </a>
                <span class="text-[10px] font-mono text-[#38bdf8] bg-[#0c2440] border border-[#164373] px-1.5 py-0.2 rounded">
                  ${ev.dateStr || ev.startDate || 'TBD'}
                </span>
                <button 
                  type="button"
                  data-action="edit"
                  data-index="${index}"
                  class="text-[10px] font-mono text-slate-500 hover:text-[#38bdf8] hover:underline cursor-pointer"
                >
                  [edit]
                </button>
              </div>

              <div class="flex flex-wrap items-center gap-x-2 text-[11px] text-slate-400 mt-1">
                <span class="flex items-center gap-1 text-slate-300">
                  <span class="text-red-400 text-[10px]">📍</span>${ev.location || 'TBD'}
                </span>
                ${ev.sponsors ? `<span class="text-slate-600">•</span><span class="text-slate-400 font-mono text-[10px]">INFO: ${ev.sponsors}</span>` : ''}
              </div>

              <div class="flex items-center gap-2 text-[10px] font-mono mt-1.5 border-t border-[#0e2136] pt-1.5">
                <div class="flex items-center gap-1">
                  <span class="text-slate-400">Y:</span>
                  ${yArr.length > 0 
                    ? yArr.map(init => `<span class="bg-[#0d2a29] border border-[#155e56] text-[#00ffcc] font-bold px-1.5 py-0.2 rounded text-[10px]">${init}</span>`).join('')
                    : `<span class="text-slate-600">--</span>`
                  }
                </div>
                <span class="text-slate-700">|</span>
                <div class="flex items-center gap-1">
                  <span class="text-slate-400">M:</span>
                  ${mArr.length > 0 
                    ? mArr.map(init => `<span class="bg-[#2c2214] border border-[#6b4715] text-[#f59e0b] font-bold px-1.5 py-0.2 rounded text-[10px]">${init}</span>`).join('')
                    : `<span class="text-slate-600">--</span>`
                  }
                </div>
                ${nArr.length > 0 ? `
                  <span class="text-slate-700">|</span>
                  <div class="flex items-center gap-1">
                    <span class="text-slate-400">N:</span>
                    ${nArr.map(init => `<span class="bg-[#1a2333] border border-[#2b3a55] text-slate-400 px-1.5 py-0.2 rounded text-[10px]">${init}</span>`).join('')}
                  </div>
                ` : ''}
              </div>
            </div>

            <div class="shrink-0 self-end md:self-center">
              <div class="flex items-center border border-[#163860] bg-[#06101d] rounded overflow-hidden">
                <button 
                  type="button"
                  data-action="rsvp"
                  data-status="Y"
                  data-index="${index}"
                  class="px-2.5 py-1 text-xs font-bold transition-colors cursor-pointer ${isY ? 'bg-[#00e699] text-[#050b14]' : 'text-slate-400 hover:bg-[#0c223a] hover:text-[#00e699]'}"
                >Y</button>
                <button 
                  type="button"
                  data-action="rsvp"
                  data-status="M"
                  data-index="${index}"
                  class="px-2.5 py-1 text-xs font-bold border-l border-[#163860] transition-colors cursor-pointer ${isM ? 'bg-[#f59e0b] text-[#050b14]' : 'text-slate-400 hover:bg-[#0c223a] hover:text-[#f59e0b]'}"
                >M</button>
                <button 
                  type="button"
                  data-action="rsvp"
                  data-status="N"
                  data-index="${index}"
                  class="px-2.5 py-1 text-xs font-bold border-l border-[#163860] transition-colors cursor-pointer ${isN ? 'bg-slate-700 text-white' : 'text-slate-500 hover:bg-[#0c223a] hover:text-slate-300'}"
                >N</button>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    async function loadEvents() {
      const banner = document.getElementById('sync-banner');
      try {
        const res = await fetch(SHEET_API_URL);
        if (res.ok) {
          const liveRows = await res.json();
          if (Array.isArray(liveRows) && liveRows.length > 0) {
            eventsData = liveRows;
            eventsData.sort((a, b) => String(a.startDate || '').localeCompare(String(b.startDate || '')));
            if (banner) {
              banner.textContent = '[LIVE]';
              banner.className = 'text-[10px] text-[#00ffcc] font-mono tracking-wide ml-1';
            }
          }
        }
      } catch (err) {
        if (banner) {
          banner.textContent = '[OFFLINE / SEED]';
          banner.className = 'text-[10px] text-amber-400 font-mono tracking-wide ml-1';
        }
      }
      renderEvents();
    }

    function openEdit(index) {
      const ev = eventsData[index];
      if (!ev) return;

      document.getElementById('modal-event-index').value = String(index);
      document.getElementById('modal-heading').textContent = 'EDIT EVENT';
      document.getElementById('modal-save-btn').textContent = 'SAVE TO SHEET';

      document.getElementById('modal-url').value = ev.url || '';
      document.getElementById('modal-title').value = ev.title || '';
      document.getElementById('modal-date-str').value = ev.dateStr || '';
      document.getElementById('modal-start-date').value = ev.startDate || '';
      document.getElementById('modal-location').value = ev.location || '';
      document.getElementById('modal-sponsors').value = ev.sponsors || '';

      const modal = document.getElementById('event-modal');
      modal.style.display = 'flex';
    }

    function openAddModal() {
      document.getElementById('modal-event-index').value = '';
      document.getElementById('modal-heading').textContent = 'ADD NEW EVENT';
      document.getElementById('modal-save-btn').textContent = 'ADD TO SHEET';

      document.getElementById('modal-url').value = '';
      document.getElementById('modal-title').value = '';
      document.getElementById('modal-date-str').value = '';
      document.getElementById('modal-start-date').value = '';
      document.getElementById('modal-location').value = '';
      document.getElementById('modal-sponsors').value = '';

      const modal = document.getElementById('event-modal');
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('event-modal').style.display = 'none';
    }

    function postToSheet(payload) {
      const banner = document.getElementById('sync-banner');
      if (banner) {
        banner.textContent = '[SAVING...]';
        banner.className = 'text-[10px] text-amber-400 font-mono tracking-wide ml-1';
      }

      fetch(SHEET_API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      }).then(() => {
        if (banner) {
          banner.textContent = '[SAVED]';
          banner.className = 'text-[10px] text-[#00ffcc] font-mono tracking-wide ml-1';
          setTimeout(() => { banner.textContent = '[LIVE]'; }, 2000);
        }
      });
    }

    function saveEventChanges() {
      const idxStr = document.getElementById('modal-event-index').value;
      const url = document.getElementById('modal-url').value.trim();
      let title = document.getElementById('modal-title').value.trim() || 'New Event';
      let dateStr = document.getElementById('modal-date-str').value.trim();
      let startDate = document.getElementById('modal-start-date').value.trim() || '2026-12-31';
      let location = document.getElementById('modal-location').value.trim();
      let sponsors = document.getElementById('modal-sponsors').value.trim();

      if (!dateStr) dateStr = startDate;

      if (idxStr !== '') {
        const ev = eventsData[Number(idxStr)];
        if (ev) {
          ev.url = url;
          ev.title = title;
          ev.dateStr = dateStr;
          ev.startDate = startDate;
          ev.location = location;
          ev.sponsors = sponsors;
          
          renderEvents();
          closeModal();

          postToSheet({
            action: 'edit',
            id: ev.id,
            title,
            startDate,
            dateStr,
            location,
            url,
            sponsors
          });
        }
      } else {
        closeModal();
        postToSheet({
          action: 'add',
          title,
          startDate,
          dateStr,
          location,
          url,
          sponsors,
          yAttendees: userInitials || ''
        });
        setTimeout(loadEvents, 1500);
      }
    }

    function setRSVP(index, status) {
      const initialsBox = document.getElementById('user-initials');
      if (!userInitials) {
        if (initialsBox) {
          initialsBox.focus();
          initialsBox.classList.add('ring-2', 'ring-[#00ffcc]');
          setTimeout(() => initialsBox.classList.remove('ring-2', 'ring-[#00ffcc]'), 1500);
        }
        return;
      }

      const ev = eventsData[index];
      if (!ev) return;

      let y = cleanArray(ev.yAttendees);
      let m = cleanArray(ev.mAttendees);
      let n = cleanArray(ev.nAttendees);

      const isCurrentY = y.includes(userInitials);
      const isCurrentM = m.includes(userInitials);
      const isCurrentN = n.includes(userInitials);

      y = y.filter(i => i !== userInitials);
      m = m.filter(i => i !== userInitials);
      n = n.filter(i => i !== userInitials);

      if (status === 'Y' && !isCurrentY) y.push(userInitials);
      if (status === 'M' && !isCurrentM) m.push(userInitials);
      if (status === 'N' && !isCurrentN) n.push(userInitials);

      ev.yAttendees = y.join(';');
      ev.mAttendees = m.join(';');
      ev.nAttendees = n.join(';');

      renderEvents();

      postToSheet({
        action: 'rsvp',
        id: ev.id,
        title: ev.title,
        yAttendees: ev.yAttendees,
        mAttendees: ev.mAttendees,
        nAttendees: ev.nAttendees
      });
    }

    // Attach all event handlers once DOM is fully parsed
    window.addEventListener('DOMContentLoaded', () => {
      const initialsInput = document.getElementById('user-initials');
      if (initialsInput) {
        initialsInput.value = userInitials;
        initialsInput.addEventListener('input', (e) => {
          userInitials = e.target.value.trim().toUpperCase();
          localStorage.setItem('radar_initials', userInitials);
          renderEvents();
        });
      }

      const listContainer = document.getElementById('event-list');
      if (listContainer) {
        listContainer.addEventListener('click', (e) => {
          const btn = e.target.closest('button');
          if (!btn) return;

          const action = btn.dataset.action;
          const index = Number(btn.dataset.index);

          if (action === 'edit') {
            openEdit(index);
          } else if (action === 'rsvp') {
            const status = btn.dataset.status;
            setRSVP(index, status);
          }
        });
      }

      const btnAdd = document.getElementById('btn-add-event');
      if (btnAdd) btnAdd.addEventListener('click', openAddModal);

      const btnWhoDis = document.getElementById('btn-who-dis');
      const whoDisModal = document.getElementById('who-dis-modal');
      if (btnWhoDis && whoDisModal) {
        btnWhoDis.addEventListener('click', () => { whoDisModal.style.display = 'flex'; });
      }

      const whoDisClose = document.getElementById('who-dis-close');
      if (whoDisClose && whoDisModal) {
        whoDisClose.addEventListener('click', () => { whoDisModal.style.display = 'none'; });
      }

      const modalCloseX = document.getElementById('modal-close-x');
      if (modalCloseX) modalCloseX.addEventListener('click', closeModal);

      const modalCancelBtn = document.getElementById('modal-cancel-btn');
      if (modalCancelBtn) modalCancelBtn.addEventListener('click', closeModal);

      const modalSaveBtn = document.getElementById('modal-save-btn');
      if (modalSaveBtn) modalSaveBtn.addEventListener('click', saveEventChanges);

      // Render default seed data immediately, then sync with Sheets
      renderEvents();
      loadEvents();
    });
  </script>
</body>
</html>
