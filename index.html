<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADAR // CHRONOLOGICAL ROLLCALL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            pixel: ['"Press Start 2P"', 'monospace'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #050b14;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }
    input, button, textarea {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-12">

  <!-- COMMAND HEADER -->
  <header class="w-full max-w-5xl px-3 py-2.5 flex items-center justify-between border-b border-[#0f2338] sticky top-0 bg-[#050b14]/95 backdrop-blur z-20">
    <div class="flex items-center gap-2">
      <span class="inline-block w-2.5 h-2.5 bg-[#00ffcc] shadow-[0_0_8px_#00ffcc]"></span>
      <span class="font-pixel text-xs tracking-wider text-[#00ffcc]">RADAR://NET</span>
      <span class="text-[11px] text-[#38bdf8]/60 font-mono tracking-wide ml-1">[CHRONOLOGICAL ROLLCALL]</span>
    </div>

    <div class="flex items-center gap-2">
      <div class="flex items-center bg-[#071322] border border-[#163252] px-2 py-1 rounded text-xs">
        <span class="text-[#38bdf8] mr-1.5 text-[11px] font-bold">ID:</span>
        <input 
          id="user-initials" 
          type="text" 
          maxlength="10" 
          placeholder="INITIALS" 
          class="w-20 bg-transparent text-[#00ffcc] font-bold uppercase outline-none focus:text-white"
        />
      </div>

      <button 
        onclick="openAddModal()" 
        class="bg-[#00e699] hover:bg-[#00ffab] text-[#050b14] font-bold text-xs px-2.5 py-1 rounded flex items-center gap-1 transition-all active:scale-95"
      >
        <span>+</span> EVENT
      </button>

      <button 
        onclick="openWhoDis()" 
        class="bg-[#081e36] border border-[#19406b] hover:border-[#38bdf8] text-[#38bdf8] text-xs px-2.5 py-1 rounded flex items-center gap-1"
      >
        <span>📇</span> WHO DIS?
      </button>
    </div>
  </header>

  <!-- EVENT STREAM -->
  <main class="w-full max-w-5xl px-3 py-3">
    <div id="event-list" class="space-y-2">
      <div class="text-xs text-[#38bdf8]/60 py-12 text-center animate-pulse">Scanning live sheet data...</div>
    </div>
  </main>

  <!-- EDIT / ADD MODAL -->
  <div id="event-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-30 hidden flex items-center justify-center p-3">
    <div class="bg-[#081526] border border-[#163860] w-full max-w-md p-4 rounded-lg shadow-2xl space-y-3">
      <div class="flex justify-between items-center border-b border-[#163860] pb-2">
        <span id="modal-heading" class="font-pixel text-[10px] text-[#00ffcc]">EDIT EVENT</span>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
      </div>

      <!-- Hidden tracking row -->
      <input type="hidden" id="modal-sheet-row" value="">

      <div>
        <label class="block text-[10px] text-[#38bdf8] uppercase font-bold mb-1">Web Address</label>
        <div class="flex gap-1.5">
          <input 
            id="modal-url" 
            type="url" 
            placeholder="https://conference.org" 
            class="w-full bg-[#050b14] border border-[#163860] px-2.5 py-1.5 rounded text-xs text-white outline-none focus:border-[#00ffcc]"
          />
        </div>
      </div>

      <div class="space-y-2 pt-1 border-t border-[#163860]/50 text-xs">
        <div>
          <label class="block text-[10px] text-slate-400 uppercase mb-0.5">Title</label>
          <input id="modal-title" type="text" class="w-full bg-[#050b14] border border-[#163860] px-2 py-1 rounded text-white outline-none focus:border-[#00ffcc]">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-slate-400 uppercase mb-0.5">Date Display</label>
            <input id="modal-date-str" type="text" placeholder="e.g. Oct 1–3, 2026" class="w-full bg-[#050b14] border border-[#163860] px-2 py-1 rounded text-white outline-none focus:border-[#00ffcc]">
          </div>
          <div>
            <label class="block text-[10px] text-slate-400 uppercase mb-0.5">Start Date (YYYY-MM-DD)</label>
            <input id="modal-start-date" type="date" class="w-full bg-[#050b14] border border-[#163860] px-2 py-1 rounded text-white outline-none focus:border-[#00ffcc] text-[11px]">
          </div>
        </div>

        <div>
          <label class="block text-[10px] text-slate-400 uppercase mb-0.5">Location</label>
          <input id="modal-location" type="text" class="w-full bg-[#050b14] border border-[#163860] px-2 py-1 rounded text-white outline-none focus:border-[#00ffcc]">
        </div>

        <div>
          <label class="block text-[10px] text-slate-400 uppercase mb-0.5">Key Sponsors / Hosts</label>
          <input id="modal-sponsors" type="text" class="w-full bg-[#050b14] border border-[#163860] px-2 py-1 rounded text-white outline-none focus:border-[#00ffcc]">
        </div>
      </div>

      <div class="pt-2 flex justify-end gap-2 border-t border-[#163860]">
        <button onclick="closeModal()" class="px-3 py-1 text-xs text-slate-400 hover:text-white">CANCEL</button>
        <button id="modal-save-btn" onclick="saveEventChanges()" class="bg-[#00e699] text-[#050b14] font-bold px-4 py-1 text-xs rounded hover:bg-[#00ffab]">
          SAVE TO SHEET
        </button>
      </div>
    </div>
  </div>

  <!-- WHO DIS MODAL -->
  <div id="who-dis-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-30 hidden flex items-center justify-center p-3">
    <div class="bg-[#081526] border border-[#163860] w-full max-w-sm p-4 rounded-lg space-y-3 shadow-2xl">
      <div class="flex justify-between items-center border-b border-[#163860] pb-2">
        <span class="font-pixel text-[10px] text-[#38bdf8]">WHO DIS? // RADAR OPERATOR</span>
        <button onclick="closeWhoDis()" class="text-slate-400 hover:text-white text-base">✕</button>
      </div>
      <div class="space-y-2 text-xs text-slate-300">
        <p>Attendees use 2-letter initials or nicknames for lightweight anonymity.</p>
        <div class="bg-[#050b14] border border-[#163860] rounded p-2 text-[#00ffcc] font-mono text-[11px]">
          &gt; Message Cobb via Text, Signal, WhatsApp, or Telegram.
        </div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyLOxhsA3a86NO0A3MLrqg5fNVb0Tb_MGwUMb3wamgdSJyiyh9om0ritl8j5VODZz_z/exec";

    let eventsData = [];
    let userInitials = localStorage.getItem('radar_initials') || '';

    const initialsInput = document.getElementById('user-initials');
    initialsInput.value = userInitials;
    initialsInput.addEventListener('input', (e) => {
      userInitials = e.target.value.trim().toUpperCase();
      localStorage.setItem('radar_initials', userInitials);
      renderEvents();
    });

    async function loadEvents() {
      try {
        const res = await fetch(SHEET_API_URL);
        if (res.ok) {
          const liveRows = await res.json();
          if (Array.isArray(liveRows) && liveRows.length > 0) {
            eventsData = liveRows;
          }
        }
      } catch (err) {
        console.error('Fetch failed:', err);
      }
      renderEvents();
    }

    function renderEvents() {
      const list = document.getElementById('event-list');
      if (eventsData.length === 0) {
        list.innerHTML = `<div class="text-xs text-slate-500 py-12 text-center">No events found in Google Sheet. Click [+ EVENT] to add one.</div>`;
        return;
      }

      const sorted = [...eventsData].sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));

      list.innerHTML = sorted.map(ev => {
        const yArr = (ev.yAttendees || '').split(';').filter(Boolean);
        const mArr = (ev.mAttendees || '').split(';').filter(Boolean);
        const nArr = (ev.nAttendees || '').split(';').filter(Boolean);

        const isY = userInitials && yArr.includes(userInitials);
        const isM = userInitials && mArr.includes(userInitials);
        const isN = userInitials && nArr.includes(userInitials);

        return `
          <div class="bg-[#081321] border border-[#122842] hover:border-[#1d426d] px-3.5 py-2.5 rounded-md flex flex-col md:flex-row items-start md:items-center justify-between gap-2.5 transition-colors">
            
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-2">
                <a href="${ev.url}" target="_blank" class="text-xs font-bold text-white hover:text-[#38bdf8] flex items-center gap-1">
                  ${ev.title || 'Untitled'}
                  <span class="text-[10px] text-slate-400">↗</span>
                </a>
                <span class="text-[10px] font-mono text-[#38bdf8] bg-[#0c2440] border border-[#164373] px-1.5 py-0.2 rounded">
                  ${ev.dateStr || ev.startDate || 'TBD'}
                </span>
                <button 
                  onclick="openEditByRow(${ev.sheetRow})" 
                  class="text-[10px] font-mono text-slate-500 hover:text-[#38bdf8] hover:underline"
                >
                  [edit]
                </button>
              </div>

              <div class="flex flex-wrap items-center gap-x-2 text-[11px] text-slate-400 mt-1">
                <span class="flex items-center gap-1 text-slate-300">
                  <span class="text-red-400 text-[10px]">📍</span>${ev.location || 'TBD'}
                </span>
                ${ev.sponsors ? `<span class="text-slate-600">•</span><span class="text-slate-400 font-mono text-[10px]">INFO: ${ev.sponsors}</span>` : ''}
              </div>

              <div class="flex items-center gap-2 text-[10px] font-mono mt-1.5 border-t border-[#0e2136] pt-1.5">
                <div class="flex items-center gap-1">
                  <span class="text-slate-400">Y:</span>
                  ${yArr.length > 0 
                    ? yArr.map(init => `<span class="bg-[#0d2a29] border border-[#155e56] text-[#00ffcc] font-bold px-1.5 py-0.2 rounded text-[10px]">${init}</span>`).join('')
                    : `<span class="text-slate-600">--</span>`
                  }
                </div>
                <span class="text-slate-700">|</span>
                <div class="flex items-center gap-1">
                  <span class="text-slate-400">M:</span>
                  ${mArr.length > 0 
                    ? mArr.map(init => `<span class="bg-[#2c2214] border border-[#6b4715] text-[#f59e0b] font-bold px-1.5 py-0.2 rounded text-[10px]">${init}</span>`).join('')
                    : `<span class="text-slate-600">--</span>`
                  }
                </div>
                ${nArr.length > 0 ? `
                  <span class="text-slate-700">|</span>
                  <div class="flex items-center gap-1">
                    <span class="text-slate-400">N:</span>
                    ${nArr.map(init => `<span class="bg-[#1a2333] border border-[#2b3a55] text-slate-400 px-1.5 py-0.2 rounded text-[10px]">${init}</span>`).join('')}
                  </div>
                ` : ''}
              </div>
            </div>

            <div class="shrink-0 self-end md:self-center">
              <div class="flex items-center border border-[#163860] bg-[#06101d] rounded overflow-hidden">
                <button 
                  onclick="setRSVPByRow(${ev.sheetRow}, 'Y')" 
                  class="px-2.5 py-1 text-xs font-bold transition-colors ${isY ? 'bg-[#00e699] text-[#050b14]' : 'text-slate-400 hover:bg-[#0c223a] hover:text-[#00e699]'}"
                >Y</button>
                <button 
                  onclick="setRSVPByRow(${ev.sheetRow}, 'M')" 
                  class="px-2.5 py-1 text-xs font-bold border-l border-[#163860] transition-colors ${isM ? 'bg-[#f59e0b] text-[#050b14]' : 'text-slate-400 hover:bg-[#0c223a] hover:text-[#f59e0b]'}"
                >M</button>
                <button 
                  onclick="setRSVPByRow(${ev.sheetRow}, 'N')" 
                  class="px-2.5 py-1 text-xs font-bold border-l border-[#163860] transition-colors ${isN ? 'bg-slate-700 text-white' : 'text-slate-500 hover:bg-[#0c223a] hover:text-slate-300'}"
                >N</button>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    function openEditByRow(sheetRow) {
      const ev = eventsData.find(e => e.sheetRow === sheetRow);
      if (!ev) return;

      document.getElementById('modal-sheet-row').value = ev.sheetRow;
      document.getElementById('modal-heading').textContent = `EDIT EVENT (ROW ${ev.sheetRow})`;
      document.getElementById('modal-save-btn').textContent = 'SAVE TO SHEET';

      document.getElementById('modal-url').value = ev.url || '';
      document.getElementById('modal-title').value = ev.title || '';
      document.getElementById('modal-date-str').value = ev.dateStr || '';
      document.getElementById('modal-start-date').value = ev.startDate || '';
      document.getElementById('modal-location').value = ev.location || '';
      document.getElementById('modal-sponsors').value = ev.sponsors || '';

      document.getElementById('event-modal').classList.remove('hidden');
    }

    function openAddModal() {
      document.getElementById('modal-sheet-row').value = '';
      document.getElementById('modal-heading').textContent = 'ADD NEW EVENT';
      document.getElementById('modal-save-btn').textContent = 'ADD TO SHEET';

      document.getElementById('modal-url').value = '';
      document.getElementById('modal-title').value = '';
      document.getElementById('modal-date-str').value = '';
      document.getElementById('modal-start-date').value = '';
      document.getElementById('modal-location').value = '';
      document.getElementById('modal-sponsors').value = '';

      document.getElementById('event-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('event-modal').classList.add('hidden');
    }

    function saveEventChanges() {
      const sheetRow = document.getElementById('modal-sheet-row').value;
      const url = document.getElementById('modal-url').value.trim();
      let title = document.getElementById('modal-title').value.trim() || 'New Event';
      let dateStr = document.getElementById('modal-date-str').value.trim();
      let startDate = document.getElementById('modal-start-date').value || '2026-12-31';
      let location = document.getElementById('modal-location').value.trim();
      let sponsors = document.getElementById('modal-sponsors').value.trim();

      if (!dateStr) dateStr = startDate;

      if (sheetRow) {
        // DIRECT ROW EDIT
        const ev = eventsData.find(e => e.sheetRow === parseInt(sheetRow, 10));
        if (ev) {
          ev.url = url;
          ev.title = title;
          ev.dateStr = dateStr;
          ev.startDate = startDate;
          ev.location = location;
          ev.sponsors = sponsors;
          renderEvents();
          closeModal();

          fetch(SHEET_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'edit_row',
              sheetRow: parseInt(sheetRow, 10),
              title,
              startDate,
              dateStr,
              location,
              url,
              sponsors
            })
          });
        }
      } else {
        // ADD NEW ROW
        closeModal();
        fetch(SHEET_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'add',
            title,
            startDate,
            dateStr,
            location,
            url,
            sponsors,
            yAttendees: userInitials || ''
          })
        }).then(() => setTimeout(loadEvents, 1200));
      }
    }

    function setRSVPByRow(sheetRow, status) {
      if (!userInitials) {
        initialsInput.focus();
        return;
      }

      const ev = eventsData.find(e => e.sheetRow === sheetRow);
      if (!ev) return;

      let y = (ev.yAttendees || '').split(';').filter(Boolean);
      let m = (ev.mAttendees || '').split(';').filter(Boolean);
      let n = (ev.nAttendees || '').split(';').filter(Boolean);

      const currentStatus = y.includes(userInitials) ? 'Y' : m.includes(userInitials) ? 'M' : n.includes(userInitials) ? 'N' : null;

      y = y.filter(i => i !== userInitials);
      m = m.filter(i => i !== userInitials);
      n = n.filter(i => i !== userInitials);

      if (currentStatus !== status) {
        if (status === 'Y') y.push(userInitials);
        if (status === 'M') m.push(userInitials);
        if (status === 'N') n.push(userInitials);
      }

      ev.yAttendees = y.join(';');
      ev.mAttendees = m.join(';');
      ev.nAttendees = n.join(';');

      renderEvents();

      fetch(SHEET_API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'rsvp_row',
          sheetRow: ev.sheetRow,
          yAttendees: ev.yAttendees,
          mAttendees: ev.mAttendees,
          nAttendees: ev.nAttendees
        })
      });
    }

    function openWhoDis() {
      document.getElementById('who-dis-modal').classList.remove('hidden');
    }
    function closeWhoDis() {
      document.getElementById('who-dis-modal').classList.add('hidden');
    }

    loadEvents();
  </script>
</body>
</html>
